    <!-- JSON-LD: Schema.org SoftwareApplication + Person (for AI agents / search) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "NEXUS — ML Research Platform",
      "alternateName": "ML Research Platform",
      "applicationCategory": "ResearchApplication",
      "applicationSubCategory": "Machine Learning Research",
      "operatingSystem": "Web",
      "description": "A no-code research platform built on the mathematics of optimization: automated data cleaning, Extreme Learning Machine (ELM) training, and pretrained AI inference across image classification, medical imaging, and object detection.",
      "url": "https://ml-research-platform.vercel.app/",
      "featureList": [
        "Data Forensic and Cleaning: automated EDA, missing values, outlier detection",
        "ELM Studio: Extreme Learning Machine training with cross-validation",
        "AI Model Hub: pretrained image classification, medical imaging, object detection"
      ],
      "creator": {
        "@type": "Person",
        "name": "Dr. Kobkoon Janngam",
        "jobTitle": "Researcher",
        "affiliation": {
          "@type": "EducationalOrganization",
          "name": "Chiang Mai University",
          "url": "https://www.cmu.ac.th/"
        }
      },
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      }
    }
    </script>
    <!-- Blocking theme bootstrap — runs BEFORE React renders to prevent flash of wrong theme.
         Must match THEME_KEY in src/lib/constants.js and ThemeContext default. -->
    <script>
      (function() {
        try {
          // One-time migration: clear the legacy key so all returning users
          // get the new dark-by-default behavior on next visit.
          localStorage.removeItem('mlplatform_theme');
          var saved = localStorage.getItem('mlplatform_theme_v2');
          var theme = saved === 'light' ? 'light' : 'dark';
          var root = document.documentElement;
          root.setAttribute('data-theme', theme);
          root.classList.remove('light', 'dark');
          root.classList.add(theme);
          root.style.colorScheme = theme;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
